<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 72" width="360" height="72">
  <!-- DancingElephant concept 05 "Wordmark" — two-weight Fraunces wordmark over a hand-drawn gradient rule.
       NOTE: renders with the Fraunces font when installed (falls back to Georgia/serif); for production, convert text to outlines. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFC"/><stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>
  <text x="180" y="38" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="34" letter-spacing="-0.5">
    <tspan font-weight="300" fill="#2A2233">dancing</tspan><tspan font-weight="600" fill="#7C5CFC">elephant</tspan>
  </text>
  <path d="M120,52 C148,48 178,56 206,51 C218,49 228,50 240,51" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
</svg>
